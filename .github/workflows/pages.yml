name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biên dịch nội dung
        run: npm run content
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Kiểm tra nội dung
        run: npm run validate
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build
      - name: Chuẩn bị trang
        run: |
          mkdir _site
          cp dist/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
