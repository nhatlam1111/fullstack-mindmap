# Lab thử nghiệm trên máy bạn: `docker compose up -d` (PostgreSQL), thêm `--profile oracle` để chạy Oracle.
# Phiên bản được cố định để kết quả tái lập được.
services:
  postgres:
    image: postgres:16          # cùng major version với các lần chạy ghi trong README
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    # Cổng 5432 trên máy Lam đã có PostgreSQL 17 cài sẵn; lab dùng 5433 (đổi bằng LAB_PG_PORT).
    # Chỉ mở trên 127.0.0.1: mật khẩu lab yếu, không để máy khác trong mạng kết nối vào.
    ports: ["127.0.0.1:${LAB_PG_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  oracle:
    # Image Oracle Database Free do cộng đồng duy trì (gvenzl), phổ biến cho môi trường dev/test.
    # Kết nối: localhost:1521, service FREEPDB1, user lab / mật khẩu lab.
    image: gvenzl/oracle-free:23.26.1-slim
    environment:
      ORACLE_PASSWORD: lab_admin
      APP_USER: lab
      APP_USER_PASSWORD: lab
    ports: ["127.0.0.1:1521:1521"]
    volumes: ["oradata:/opt/oracle/oradata"]
    profiles: ["oracle"]

  # Chặng 5 thêm redis và mongo.

volumes:
  pgdata:
  oradata:
