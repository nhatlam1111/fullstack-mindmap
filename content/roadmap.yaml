# Lộ trình gồm các chặng có thứ tự. Học theo tốc độ riêng: xong chặng nào thì chuyển sang chặng tiếp, không gắn với lịch.
# Bài thực hành xuyên suốt: hệ thống nghiên cứu thị trường game mobile (learn-practice-case), chỉ dùng PostgreSQL,
# stack TypeScript (NestJS, Next.js), triển khai trên Azure, mã nguồn công khai trên GitHub.
# Khóa `week` là số thứ tự chặng (tên khóa giữ từ thời lộ trình 24 tuần). Một chủ đề có thể nằm trong nhiều chặng;
# chặng của chủ đề được suy ra từ file này.
# Kỹ năng làm việc với coding agent được học sớm (chặng 1 và 4) vì bài thực hành có thể được viết cùng AI ngay từ đầu;
# chặng 28–29 quay lại đào sâu khi đã có đủ kinh nghiệm thực tế.
phases:
  - id: p1
    title: Database và dữ liệu
    weeks: [1, 2, 3, 4, 5, 6]
  - id: p2
    title: Nền tảng web
    weeks: [7, 8, 9]
  - id: p3
    title: Frontend
    weeks: [10, 11, 12]
  - id: p4
    title: Backend và tích hợp
    weeks: [13, 14, 15]
  - id: p5
    title: Kiến trúc ứng dụng
    weeks: [16, 17]
  - id: p6
    title: Container, CI/CD và Azure
    weeks: [18, 19, 20]
  - id: p7
    title: Vận hành, bảo mật và kiến trúc hệ thống
    weeks: [21, 22, 23]
  - id: p8
    title: Tiền và thanh toán
    weeks: [24]
  - id: p9
    title: AI engineering
    weeks: [25, 26, 27]
  - id: p10
    title: Phát triển phần mềm cùng AI
    weeks: [28, 29]
  - id: p11
    title: Tổng hợp
    weeks: [30]

weeks:
  - week: 1
    title: Database, schema và mô hình quan hệ
    goal: Phân biệt đúng các khái niệm nền tảng và thiết kế được schema có ràng buộc cho bài thực hành.
    practice: Viết đặc tả ngắn cho hệ thống nghiên cứu thị trường game (nguồn dữ liệu, quốc gia, bảng xếp hạng cần theo dõi, tiêu chí game nổi bật), đủ rõ để giao cho một coding agent. Tạo tài khoản SerpApi gói Free, gọi tay Google Play API một lần để lấy JSON bảng xếp hạng game của một quốc gia, lưu làm dữ liệu mẫu (không commit API key) và thử xem tham số chart có ghép được với danh mục game không. Thiết kế schema trên PostgreSQL gồm game, nhà phát triển, thể loại, quốc gia, lần chụp, thứ hạng trong mỗi lần chụp, lịch sử điểm đánh giá và mốc lượt tải; đủ primary key, foreign key, unique, check.
    checkpoint: Schema chạy được trên PostgreSQL và nạp được JSON mẫu; giải thích được vì sao mỗi constraint tồn tại và vì sao bảng được tách như vậy.
    topics: [learn-six-questions, learn-using-mindmap, learn-practice-case, learn-lab, aidev-writing-specs, db-database-dbms, db-sql-nosql-terms, db-schema-data-model, db-tables-keys-constraints, db-normalization, db-joins]

  - week: 2
    title: Transaction, isolation, MVCC và locking
    goal: Hiểu cơ chế đọc ghi đồng thời và mức bảo đảm mà PostgreSQL thực sự cung cấp.
    practice: Trong lab, chạy song song hai tiến trình cùng nhập một lần chụp bảng xếp hạng để tái hiện bản ghi trùng hoặc lost update ở bảng tổng hợp của game; chặn bằng unique constraint kèm INSERT ... ON CONFLICT, bằng SELECT ... FOR UPDATE trên dòng lần chụp, và bằng cột version (optimistic locking). Ghi lại lệnh và kết quả thật.
    checkpoint: Giải thích được khác biệt giữa Read Committed và Serializable trên PostgreSQL, đối chiếu với Oracle bạn đã biết; chỉ ra chỗ trong ứng dụng cần khóa.
    topics: [db-transaction-acid, db-isolation-levels, db-mvcc, db-locking]

  - week: 3
    title: Index và query plan
    goal: Đọc được kế hoạch thực thi và quyết định index dựa trên số đo.
    practice: Sinh khoảng 1 triệu dòng thứ hạng giả lập trong lab (nhiều quốc gia, nhiều tuần); đo bằng EXPLAIN ANALYZE trước và sau khi thêm index cho ba truy vấn — lịch sử hạng của một game, top game của một tuần theo quốc gia, game tăng hạng mạnh nhất giữa hai lần chụp. Ghi số đo thật.
    checkpoint: Mỗi index trong schema có một truy vấn và một số đo giải thích lý do tồn tại.
    topics: [db-index-basics, db-query-plan, db-btree, db-lsm-tree, db-access-patterns]

  - week: 4
    title: Ứng dụng nói chuyện với database
    goal: Dùng kết nối, transaction và tham số đúng cách từ phía ứng dụng.
    practice: Viết backend API đầu tiên bằng NestJS và TypeScript (danh sách game theo quốc gia và tuần, chi tiết game, lịch sử hạng); dùng connection pool, đặt transaction boundary ở tầng nghiệp vụ (nhập một lần chụp là một transaction), bind variable cho mọi truy vấn; bật log SQL để tìm và sửa một lỗi N+1 ở danh sách game kèm thể loại. Nếu dùng coding agent thì viết file hướng dẫn repo, viết test trước cho luồng nhập lần chụp, và review mọi diff của agent theo checklist.
    checkpoint: API chạy được; chỉ ra được nơi mở và đóng transaction; không còn truy vấn ghép chuỗi.
    topics: [db-drivers, db-connection-pool, db-transaction-boundary, db-orm, db-n-plus-one, db-timeouts, db-parameter-binding, aidev-repo-context, aidev-reviewing-ai-code, aidev-tests-as-guardrails]

  - week: 5
    title: NoSQL, workload và tìm kiếm
    goal: Biết mỗi mô hình dữ liệu và loại workload hợp với truy vấn nào.
    practice: Thêm Redis làm cache cho top game của tuần theo quốc gia, có hết hạn và vô hiệu hóa khi có lần chụp mới; thêm tìm kiếm toàn văn trên tên và mô tả game bằng full-text search của PostgreSQL.
    checkpoint: Giải thích được dữ liệu nào là nguồn sự thật, cache sai lệch tối đa bao lâu, và vì sao chọn full-text search của database thay vì công cụ riêng.
    topics: [db-key-value, db-document, db-wide-column, db-graph, db-oltp-olap, db-row-column-store, db-time-series, db-full-text-search, db-cache-source-of-truth]

  - week: 6
    title: Dữ liệu phân tán và vận hành database
    goal: Hiểu replication, consistency và vận hành database an toàn.
    practice: Đưa schema vào migration có version; thử backup rồi restore sang một database mới và đo thời gian; thử partition bảng thứ hạng theo tháng và so thời gian truy vấn trước và sau; viết một trang ghi chú lựa chọn database cho bài thực hành.
    checkpoint: Restore thành công từ backup; trả lời được câu hỏi CAP mà không biến nó thành quy tắc chọn sản phẩm.
    topics: [db-replication, db-partitioning-sharding, db-consistency-models, db-cap-pacelc, db-distributed-transactions, db-schema-migration, db-backup-restore, db-performance-monitoring, db-choosing, db-vector-search]

  - week: 7
    title: Vòng đời request và HTTP
    goal: Mô tả được từng bước của một request web và ngữ nghĩa HTTP.
    practice: Dùng curl -v và tab Network của DevTools để lần một request tới API của bài thực hành; dữ liệu chỉ đổi mỗi tuần nên đặt Cache-Control và ETag phù hợp cho từng endpoint, rồi kiểm lại bằng request thứ hai.
    checkpoint: Giải thích được từng dòng của output curl -v; mỗi endpoint có chính sách cache có lý do.
    topics: [web-request-lifecycle, web-dns, web-tcp-tls, web-http-semantics, web-http-versions, web-http-caching, web-cookies-cors, web-proxy]

  - week: 8
    title: Trình duyệt và JavaScript runtime
    goal: Hiểu cách trình duyệt dựng trang và cách JavaScript chạy bất đồng bộ.
    practice: Ghi một bản Performance trong DevTools cho một trang thật; viết script nhỏ chứng minh thứ tự chạy của task và microtask, ghi kết quả thật.
    checkpoint: Dự đoán đúng thứ tự in ra của một đoạn code có setTimeout, Promise và await.
    topics: [web-dom, web-rendering, web-browser-storage, web-event-loop, web-async, web-modules]

  - week: 9
    title: TypeScript và công cụ build
    goal: Dùng TypeScript có chủ đích và hiểu bước build.
    practice: Dựng frontend cho bài thực hành bằng Next.js và TypeScript; định nghĩa kiểu cho dữ liệu API và kiểm tra lúc chạy ở ranh giới API.
    checkpoint: Build production chạy được; giải thích được vì sao kiểu TypeScript không đủ để tin dữ liệu từ server.
    topics: [web-typescript, web-bundling, web-package-managers]

  - week: 10
    title: HTML, CSS và accessibility
    goal: Làm giao diện đúng ngữ nghĩa, responsive và dùng được bằng bàn phím.
    practice: Làm màn bảng xếp hạng (lọc theo quốc gia và thể loại) và trang chi tiết game; chạy axe và sửa hết lỗi nghiêm trọng; thao tác toàn bộ màn hình chỉ bằng bàn phím.
    checkpoint: Không còn lỗi axe nghiêm trọng; màn hình dùng được ở 375px.
    topics: [fe-semantic-html, fe-css-layout, fe-responsive, fe-accessibility]

  - week: 11
    title: Component, state và dữ liệu từ server
    goal: Tổ chức state và dữ liệu từ server không lỗi race.
    practice: Nối frontend với API; xử lý loading, error, empty; tái hiện rồi sửa lỗi đổi quốc gia nhanh làm kết quả cũ ghi đè kết quả mới.
    checkpoint: Chỉ ra nguồn sự thật của từng phần state; lỗi race đã tái hiện được và đã sửa.
    topics: [fe-component-model, fe-state-props, fe-rerender, fe-state-architecture, fe-data-fetching, fe-client-cache, fe-race-conditions]

  - week: 12
    title: Chiến lược render, form và kiểm thử. Rà soát nửa chặng đường
    goal: Chọn cách render phù hợp, làm form chắc chắn và viết test frontend.
    practice: Chọn cách render cho trang báo cáo tuần (SSR, SSG hay ISR, biết dữ liệu chỉ đổi mỗi tuần) và ghi lý do; làm form admin thêm quốc gia và bảng xếp hạng cần theo dõi, có validation ở cả client và server; viết test component và một test end-to-end; đo Core Web Vitals của trang bảng xếp hạng.
    checkpoint: Rà soát nửa chặng đường — tiến độ, bài quá hạn ôn, điều chỉnh các chặng còn lại.
    topics: [fe-csr-ssr-ssg, fe-hydration, fe-web-vitals, fe-forms, fe-validation, fe-testing, learn-weekly-schedule, learn-spaced-review]

  - week: 13
    title: Vòng đời API và thiết kế REST
    goal: Thiết kế API nhất quán và có đặc tả.
    practice: Chuẩn hóa API của bài thực hành theo một mô hình lỗi chung; sinh đặc tả OpenAPI từ NestJS và sinh tài liệu từ đó.
    checkpoint: Mọi endpoint có trong đặc tả; lỗi trả về cùng một cấu trúc.
    topics: [be-concurrency-models, be-api-lifecycle, be-validation-errors, be-rest-design, be-openapi, be-graphql-grpc]

  - week: 14
    title: Xác thực và phân quyền
    goal: Biết ai đang gọi và họ được làm gì.
    practice: Thêm hai vai trò cho bài thực hành — khách xem dashboard công khai, admin cấu hình quốc gia và bảng xếp hạng và chạy nhập tay; admin đăng nhập bằng OIDC (GitHub hoặc Microsoft Entra ID); viết test chứng minh khách không gọi được API cấu hình và API nhập tay.
    checkpoint: Test phân quyền chạy xanh; giải thích được token được kiểm ở đâu và hết hạn thế nào.
    topics: [be-authentication, be-oauth-oidc, be-authorization]

  - week: 15
    title: Bất đồng bộ và tích hợp
    goal: Xử lý việc chậm và sự kiện từ bên ngoài mà không lặp tác dụng phụ.
    practice: Chạy việc nhập lần chụp hằng tuần qua background job có retry và backoff (tôn trọng giới hạn 50 lượt mỗi giờ của SerpApi), idempotency key là bộ ba quốc gia, bảng xếp hạng, tuần; đẩy tiến độ nhập lên trang admin bằng SSE; viết test tích hợp với PostgreSQL thật trong container và contract test với JSON mẫu SerpApi đã lưu ở chặng 1.
    checkpoint: Chạy lại cùng một job hai lần không tạo lần chụp trùng và không tốn thêm lượt gọi SerpApi.
    topics: [be-background-jobs, be-queues, be-retry-backoff, be-idempotency, be-webhooks, be-realtime, be-integration-testing, be-contract-testing]

  - week: 16
    title: Modular monolith và Domain-Driven Design
    goal: Chia ứng dụng theo miền nghiệp vụ và ghi lại quyết định kiến trúc.
    practice: Vẽ các bounded context của bài thực hành (thu thập dữ liệu, thống kê, báo cáo và đề xuất, quản trị); tách code NestJS thành module theo context và chặn import chéo vào phần nội bộ bằng luật lint; xác định aggregate cho lần chụp; viết ADR đầu tiên giải thích vì sao chọn modular monolith.
    checkpoint: Không module nào import phần nội bộ của module khác; ADR nêu được phương án bị loại và lý do.
    topics: [arch-modular-monolith, arch-ddd-strategic, arch-ddd-tactical, arch-adr]

  - week: 17
    title: Clean Architecture, CQRS và outbox
    goal: Tách logic nghiệp vụ khỏi hạ tầng và phát sự kiện mà không mất.
    practice: Đặt nguồn dữ liệu sau một port, với một adapter gọi SerpApi và một adapter giả cho test; tách mô hình đọc (bảng hoặc materialized view thống kê tuần) khỏi mô hình ghi (lần chụp thô); phát sự kiện đã nhập xong lần chụp qua transactional outbox để tính lại thống kê.
    checkpoint: Toàn bộ test chạy mà không gọi SerpApi; dừng tiến trình giữa chừng (thử thật) mà không mất sự kiện nào.
    topics: [arch-clean-hexagonal, arch-cqrs, arch-domain-events-outbox]

  - week: 18
    title: Git, container và CI/CD
    goal: Đưa bài thực hành qua pipeline tự động.
    practice: Viết Dockerfile cho backend và frontend; dựng pipeline GitHub Actions chạy lint, test, build; đưa migration vào pipeline; bật secret scanning và push protection cho repo công khai.
    checkpoint: Pull request chỉ merge được khi pipeline xanh (branch protection).
    topics: [ops-git-model, ops-branching, ops-code-review, ops-release, ops-containers, ops-config-secrets, ops-ci-cd, ops-deploy-rollback]

  - week: 19
    title: "Azure: nền tảng, phân quyền và chạy ứng dụng"
    goal: Đưa bài thực hành lên Azure với quyền tối thiểu và không có bí mật trong code.
    practice: Tự tạo tài khoản Azure; tạo resource group và chỉ cấp quyền tối thiểu; đưa API và web lên Azure Container Apps, database lên PostgreSQL managed (nếu flexible server không còn miễn phí thì chọn phương án khác và viết ADR); cất SerpApi key trong Key Vault và cho app đọc bằng managed identity; để GitHub Actions deploy qua OIDC federation.
    checkpoint: App chạy công khai trên Azure; không có mật khẩu hay khóa nào trong repo hoặc biến pipeline; giải thích được ai có quyền gì.
    topics: [cloud-shared-responsibility, cloud-azure-structure, cloud-iam-rbac, cloud-managed-identity, cloud-compute-options, cloud-container-apps, cloud-managed-postgres, cloud-key-vault]

  - week: 20
    title: "Azure: hạ tầng dạng code, job theo lịch và chi phí"
    goal: Dựng lại được toàn bộ môi trường từ code và biết nó tốn bao nhiêu.
    practice: Viết lại toàn bộ hạ tầng bằng Terraform, rồi xóa resource group và dựng lại từ code; chạy việc nhập hằng tuần bằng Container Apps job; bật Application Insights cho API và job; đặt ngân sách và cảnh báo chi phí.
    checkpoint: Dựng lại được toàn bộ môi trường từ code; job chạy đúng lịch; cảnh báo ngân sách hoạt động.
    topics: [cloud-iac, cloud-monitor, cloud-cost]

  - week: 21
    title: Observability, bảo mật và dữ liệu cá nhân
    goal: Nhìn thấy hệ thống đang chạy thế nào và bảo vệ dữ liệu người dùng.
    practice: Thêm log có cấu trúc kèm correlation id, metric và trace cho API và job (OpenTelemetry gửi tới Application Insights); phân loại dữ liệu trong schema và chặn dữ liệu cá nhân lọt vào log; rà OWASP Top 10 cho bài thực hành; bật Dependabot.
    checkpoint: Lần được một request chậm từ log tới trace; không có dữ liệu cá nhân trong log.
    topics: [ops-logging, ops-metrics, ops-tracing, ops-slo, ops-owasp-top10, ops-supply-chain, ops-threat-modeling, ops-data-classification, ops-pii-logging, ops-access-control-data, ops-retention-deletion]

  - week: 22
    title: Xử lý sự cố production
    goal: Phát hiện, xử lý và rút kinh nghiệm từ sự cố theo một quy trình.
    practice: Đặt cảnh báo khi job nhập thất bại hoặc API trả lỗi 5xx; viết runbook cho tình huống job nhập thất bại; diễn tập trên môi trường thử bằng cách cố ý thu hồi quyền đọc Key Vault của job rồi xử lý theo runbook; viết postmortem không đổ lỗi cho lần diễn tập, hoặc cho sự cố thật nếu đã gặp.
    checkpoint: Cảnh báo tới được bạn; postmortem có dòng thời gian, nguyên nhân gốc và hành động khắc phục có người làm và hạn.
    topics: [ops-incident-response, ops-on-call, ops-runbook, ops-postmortem]

  - week: 23
    title: Kiến trúc hệ thống
    goal: Ra quyết định kiến trúc có lý do và ghi lại được.
    practice: Viết ADR cho các quyết định của bài thực hành — cách triển khai, cache, nguồn dữ liệu và nơi đặt database; thêm timeout và retry có giới hạn cho mọi lời gọi SerpApi.
    checkpoint: Mỗi ADR nêu được phương án bị loại và lý do.
    topics: [ops-monolith-microservices, ops-scaling, ops-caching-strategies, ops-reliability, ops-cost]

  - week: 24
    title: Tiền và thanh toán
    goal: Lưu tiền đúng, ghi giao dịch không lệch và đối soát được.
    practice: Làm một thử nghiệm riêng ngoài bài thực hành, chỉ dùng PostgreSQL — dựng sổ cái kép (tài khoản, bút toán, dòng bút toán) với ràng buộc bảo đảm mỗi bút toán cân bằng; viết API ghi nhận thanh toán có idempotency key và thử gửi trùng; đối soát một file quyết toán do bạn tự tạo với sổ cái và liệt kê các dòng lệch.
    checkpoint: Không ghi được bút toán lệch; gửi trùng không tạo hai giao dịch; đối soát chỉ ra đúng các dòng lệch đã cài sẵn.
    topics: [pay-money-representation, pay-ledger, pay-payment-lifecycle, pay-gateway-integration, pay-reconciliation, pay-compliance, be-idempotency]

  - week: 25
    title: Nền tảng LLM và structured output
    goal: Gọi LLM từ code và nhận kết quả xử lý được.
    practice: Dùng LLM viết báo cáo xu hướng tuần với structured output (thể loại đang lên, game tiêu biểu kèm số liệu lấy từ database, lý do); xử lý trường hợp đầu ra không hợp lệ.
    checkpoint: Đầu ra luôn qua được schema hoặc rơi vào nhánh fallback có log.
    topics: [ai-tokens-context, ai-training-inference, ai-hallucination, ai-structured-output, ai-prompt-design, ai-context-engineering]

  - week: 26
    title: Embedding, retrieval và RAG
    goal: Tìm theo ngữ nghĩa và trả lời có căn cứ.
    practice: Tìm game tương tự bằng embedding của mô tả game lưu trong pgvector; so sánh với full-text search ở chặng 5 trên cùng bộ câu hỏi.
    checkpoint: Có bảng so sánh kết quả thật giữa hai cách tìm.
    topics: [ai-embeddings, ai-retrieval-rag, ai-rag-vs-finetune, db-vector-search]

  - week: 27
    title: Tool calling, agent và đưa AI vào sản phẩm
    goal: Cho mô hình gọi công cụ an toàn và đo được chất lượng.
    practice: Viết bộ eval có đáp án cho báo cáo tuần ở chặng 25, kiểm số liệu được trích có khớp database không; đo chi phí và độ trễ mỗi lần gọi; thử một prompt injection qua mô tả game (nội dung lấy từ store là không tin cậy) và thêm lớp phòng vệ.
    checkpoint: Eval chạy được trước và sau mỗi thay đổi prompt.
    topics: [ai-tool-calling, ai-mcp, ai-workflow-vs-agent, ai-permissions, ai-evals, ai-cost-latency, ai-fallback, ai-prompt-injection]

  - week: 28
    title: Giao việc cho coding agent (đào sâu)
    goal: Viết spec và context đủ để agent làm đúng việc.
    practice: Viết spec cho một tính năng mới của bài thực hành (so sánh thị trường giữa hai quốc gia); giao cho coding agent; review diff và ghi lại các lỗi gặp phải.
    checkpoint: Có danh sách lỗi thật từ lần review, phân loại theo nguyên nhân.
    topics: [aidev-writing-specs, aidev-task-breakdown, aidev-repo-context, aidev-reviewing-ai-code, aidev-failure-modes]

  - week: 29
    title: Test làm lưới an toàn và giới hạn agent
    goal: Dùng agent mà vẫn kiểm soát được rủi ro.
    practice: Viết test trước cho một thay đổi, để agent làm trong sandbox giới hạn quyền, so sánh với lần ở chặng 28.
    checkpoint: Nêu được một việc trong bài thực hành mà bạn chọn không giao cho agent và lý do.
    topics: [aidev-tests-as-guardrails, aidev-sandbox-permissions, aidev-when-not-to-use]

  - week: 30
    title: Bài tổng hợp cuối lộ trình
    goal: Tổng hợp những gì đã học qua bài thực hành hoàn chỉnh.
    practice: Hoàn thiện bài thực hành; viết README trên GitHub trình bày kiến trúc, các ADR, số đo thật và link bản chạy trên Azure; viết retro toàn lộ trình.
    checkpoint: Rà soát toàn bộ mindmap — tỷ lệ Đã hiểu, bài quá hạn ôn, bài quá hạn rà soát.
    topics: [learn-capstone, learn-spaced-review]
